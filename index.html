<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Streamer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #111;
            color: #eee;
            font-family: system-ui, sans-serif;
        }

        /* Top bar */
        .topbar {
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            background: #1b1b1b;
            border-bottom: 1px solid #333;
        }
        .topbar input {
            flex: 1;
            max-width: 360px;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #222;
            color: inherit;
        }
        .topbar button {
            padding: 8px 16px;
            border: 0;
            border-radius: 6px;
            background: #e23636;
            color: #fff;
            cursor: pointer;
        }

        /* Main layout: player + sidebar */
        .layout {
            flex: 1;
            display: flex;
            min-height: 0;          /* lets the sidebar scroll instead of growing */
        }
        .main {
            flex: 1;
            padding: 14px;
            min-width: 0;
        }
        .main .webtor {
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 16 / 9;
            margin: 0 auto;
        }

        .sidebar {
            width: 380px;
            overflow-y: auto;
            padding: 10px;
            background: #1b1b1b;
            border-left: 1px solid #333;
        }
        .sidebar h3 { margin: 4px 4px 10px; font-size: 1em; color: #aaa; }

        #streamSearch {
            position: sticky;
            top: 0;
            z-index: 1;
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #222;
            color: inherit;
        }

        .stream {
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            background: #222;
        }
        .stream:hover { background: #2c2c2c; }
        .stream.active { border-color: #e23636; background: #2a1d1d; }
        .stream .name { font-weight: bold; white-space: pre-line; }
        .stream .title {
            white-space: pre-line;
            font-size: 0.82em;
            color: #bbb;
            word-break: break-word;
        }

        .download-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .download {
            display: none;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            padding: 10px 20px;
            border-radius: 100px;
            background: #e23636;
            color: #fff;
            border: 1px solid transparent;
            align-items: center;
            font-size: 15px;
            }

        .download:hover {
            background: #a92828;
        }

        .download > svg {
            width: 34px;
            margin-left: 10px;
            transition: transform 0.3s ease-in-out;
        }

        .download:hover svg {
            transform: translateX(5px);
        }

        .download:active {
            transform: scale(0.95);
        }
        .topbar {
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            background: #1b1b1b;
            border-bottom: 1px solid #333;
            position: relative;
            z-index: 10;
        }

        .movie-search {
            position: relative;
            flex: 1;
            min-width: 180px;
            max-width: 420px;
        }

        .movie-search input {
            width: 100%;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #222;
            color: #eee;
        }

        .movie-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            max-height: 400px;
            overflow-y: auto;
            background: #202020;
            border: 1px solid #444;
            border-radius: 8px;
            box-shadow: 0 8px 20px #0008;
            z-index: 100;
        }

        .movie-option {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }

        .movie-option:last-child {
            border-bottom: none;
        }

        .movie-option:hover {
            background: #303030;
        }

        .movie-option .movie-title {
            font-weight: 600;
        }

        .movie-option .movie-meta {
            margin-top: 3px;
            color: #aaa;
            font-size: 12px;
        }



        .series-selectors {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .series-selectors select {
            padding: 8px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #222;
            color: #eee;
            min-width: 100px;
            max-width: 160px;
        }

        .series-selectors select:disabled {
            opacity: 0.5;
        }

        @media (max-width: 800px) {
            .series-selectors {
                flex-basis: 100%;
            }

            .series-selectors select {
                flex: 1;
                max-width: none;
            }
        }

        @media (max-width: 800px) {
            .topbar {
                flex-wrap: wrap;
            }

            .movie-search {
                flex-basis: 100%;
                max-width: none;
            }
        }

        /* Stack on small screens */
        @media (max-width: 800px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; height: 40vh; border-left: 0; border-top: 1px solid #333; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="movie-search">
            <input
                type="search"
                id="movieSearch"
                placeholder="Search movies & series..."
                autocomplete="off"
            >
            <div id="movieDropdown" class="movie-dropdown"></div>
        </div>

        <div id="seriesSelectors" class="series-selectors" style="display: none;">
            <select id="seasonSelect" disabled>
                <option value="">Season</option>
            </select>

            <select id="episodeSelect" disabled>
                <option value="">Episode</option>
            </select>
        </div>

        <input
            type="text"
            id="userInput"
            placeholder="IMDb ID (e.g. tt1234567)"
        >

        <button id="submitBtn">Load</button>
    </div>

    <div class="layout">
        <div class="main">
            <div id="player" class="webtor"></div>
            <div class="download-container">
            <div></div>
            <button class="download">
            <span>Download</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" viewBox="0 0 24 24"><title>download</title><path fill="currentColor" d="m12 16l-5-5l1.4-1.45l2.6 2.6V4h2v8.15l2.6-2.6L17 11zm-6 4q-.825 0-1.412-.587T4 18v-3h2v3h12v-3h2v3q0 .825-.587 1.413T18 20z"/></svg>
            </button>
            </div>

        </div>

        <aside class="sidebar">
            <h3 id="listHeader">Streams</h3>
            <input type="search" id="streamSearch" placeholder="Filter: 4k, DV, atmos, source…" disabled>
            <div id="streamList"></div>
        </aside>
    </div>

    <script>
        const searchInput = document.getElementById('streamSearch');
        const inputField = document.getElementById('userInput');
        const submitButton = document.getElementById('submitBtn');
        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        // Read the IMDb ID from the URL query string.
        const params = new URLSearchParams(window.location.search);
        const imdbId = params.get('id');

        // Accept IMDb IDs such as tt1234567.
        if (imdbId && /^tt\d+$/.test(imdbId)) {
            inputField.value = imdbId;
            wait(100).then(() => {
            submitButton.click();
            })
        }


        let allStreams = [];
        let activeHash = null;
        

        const downloadButton = document.querySelector('.download');
        const movieSearch = document.getElementById('movieSearch');
        const movieDropdown = document.getElementById('movieDropdown');
        const seriesSelectors = document.getElementById('seriesSelectors');
        const seasonSelect = document.getElementById('seasonSelect');
        const episodeSelect = document.getElementById('episodeSelect');

        let selectedMediaType = null;
        let selectedTmdbId = null;

        let searchTimeout;
        let searchRequestId = 0;

        movieSearch.addEventListener('input', () => {
            clearTimeout(searchTimeout);

            const query = movieSearch.value.trim();
            const requestId = ++searchRequestId;

            if (query.length < 2) {
                movieDropdown.innerHTML = '';
                movieDropdown.style.display = 'none';
                return;
            }

            movieDropdown.innerHTML = `
                <div class="movie-option">Searching...</div>
            `;
            movieDropdown.style.display = 'block';

            // Wait until typing pauses before making a request.
            searchTimeout = setTimeout(() => {
                searchMovies(query, requestId);
            }, 300);
        });




        
        async function loadSeasons(tmdbId) {
            seasonSelect.innerHTML = '<option value="">Loading seasons...</option>';
            episodeSelect.innerHTML = '<option value="">Select episode</option>';

            seasonSelect.disabled = true;
            episodeSelect.disabled = true;

            try {
                const response = await fetch(
                    `/api/episodes?id=${encodeURIComponent(tmdbId)}`
                );

                if (!response.ok) {
                    throw new Error('Failed to load seasons');
                }

                const data = await response.json();

                seasonSelect.innerHTML = '<option value="">Select season</option>';

                for (const season of data.seasons || []) {
                    const option = document.createElement('option');
                    option.value = season.season_number;
                    option.textContent =
                        `${season.name || `Season ${season.season_number}`} (${season.episode_count} episodes)`;

                    seasonSelect.appendChild(option);
                }

                seasonSelect.disabled = !data.seasons?.length;
            } catch (error) {
                console.error(error);
                seasonSelect.innerHTML = '<option value="">Failed to load seasons</option>';
            }
        }

        async function loadEpisodes(tmdbId, seasonNumber) {
            episodeSelect.disabled = true;
            episodeSelect.innerHTML = '<option value="">Loading episodes...</option>';

            try {
                const params = new URLSearchParams({
                    id: String(tmdbId),
                    season: String(seasonNumber)
                });

                const response = await fetch(`/api/episodes?${params}`);

                if (!response.ok) {
                    throw new Error('Failed to load episodes');
                }

                const data = await response.json();

                episodeSelect.innerHTML = '<option value="">Select episode</option>';

                for (const episode of data.episodes || []) {
                    const option = document.createElement('option');
                    option.value = episode.episode_number;
                    option.textContent =
                        `Episode ${episode.episode_number} — ${episode.name || 'Untitled'}`;

                    episodeSelect.appendChild(option);
                }

                episodeSelect.disabled = !data.episodes?.length;
            } catch (error) {
                console.error(error);
                episodeSelect.innerHTML = '<option value="">Failed to load episodes</option>';
            }
        }

        seasonSelect.addEventListener('change', () => {
            episodeSelect.innerHTML = '<option value="">Select episode</option>';
            episodeSelect.disabled = true;

            if (selectedTmdbId && seasonSelect.value !== '') {
                loadEpisodes(selectedTmdbId, seasonSelect.value);
            }
        });


        
        async function searchMovies(query, requestId) {
            try {
                const response = await fetch(
                    `/api/search?q=${encodeURIComponent(query)}`
                );

                if (!response.ok) {
                    throw new Error(`Search failed: HTTP ${response.status}`);
                }

                const data = await response.json();

                // Ignore results from older searches.
                if (requestId !== searchRequestId) return;

                renderMovieResults(data.results || []);
            } catch (error) {
                if (requestId !== searchRequestId) return;

                console.error('Movie search failed:', error);

                movieDropdown.innerHTML = `
                    <div class="movie-option">
                        Search failed. Try again.
                    </div>
                `;

                movieDropdown.style.display = 'block';
            }
        }


        function renderMovieResults(results) {
            movieDropdown.innerHTML = '';

            if (!results.length) {
                movieDropdown.innerHTML = `
                    <div class="movie-option">No movies or series found.</div>
                `;
                movieDropdown.style.display = 'block';
                return;
            }

            for (const item of results) {
                const title = item.media_type === 'movie'
                    ? item.title
                    : item.name;

                const date = item.media_type === 'movie'
                    ? item.release_date
                    : item.first_air_date;

                const year = date ? date.slice(0, 4) : 'Year unknown';
                const type = item.media_type === 'movie' ? 'Movie' : 'TV Series';

                const option = document.createElement('div');
                option.className = 'movie-option';

                const titleElement = document.createElement('div');
                titleElement.className = 'movie-title';
                titleElement.textContent = title;

                const metaElement = document.createElement('div');
                metaElement.className = 'movie-meta';
                metaElement.textContent = `${type} • ${year}`;

                option.append(titleElement, metaElement);

                option.addEventListener('click', () => {
                    selectMovie(item, title);
                });

                movieDropdown.appendChild(option);
            }

            movieDropdown.style.display = 'block';
        }
        

        
        async function selectMovie(item, title) {
            // Invalidate any pending search responses.
            searchRequestId++;


            selectedMediaType = item.media_type;
            selectedTmdbId = item.media_type === 'tv' ? item.id : null;

            seriesSelectors.style.display =
                item.media_type === 'tv' ? 'flex' : 'none';

            seasonSelect.innerHTML = '<option value="">Select season</option>';
            episodeSelect.innerHTML = '<option value="">Select episode</option>';

            seasonSelect.disabled = true;
            episodeSelect.disabled = true;

            if (item.media_type === 'tv') {
                loadSeasons(item.id);
            }

            movieSearch.value = title;
            movieDropdown.style.display = 'none';
            movieDropdown.innerHTML = '';

            inputField.value = 'Looking up IMDb ID...';
            inputField.disabled = true;

            try {
                const params = new URLSearchParams({
                    id: String(item.id),
                    type: item.media_type
                });

                const response = await fetch(`/api/imdb?${params}`);

                if (!response.ok) {
                    throw new Error(`IMDb lookup failed: HTTP ${response.status}`);
                }

                const data = await response.json();

                if (!data.imdb_id) {
                    inputField.value = '';
                    alert('No IMDb ID was found for this title.');
                    return;
                }

                inputField.value = data.imdb_id;
            } catch (error) {
                console.error('Failed to retrieve IMDb ID:', error);

                inputField.value = '';
                alert('Could not retrieve the IMDb ID. Please try again.');
            } finally {
                inputField.disabled = false;
            }
        }


        // Close the dropdown when clicking elsewhere.
        document.addEventListener('click', event => {
            if (!event.target.closest('.movie-search')) {
                movieDropdown.style.display = 'none';
            }
        });

        downloadButton.addEventListener('click', () => {
            if (!activeHash) return;

            window.open(
                `https://webtor.io/${activeHash}`,
                '_blank',
                'noopener,noreferrer'
            );
        });

        async function fetchStreams(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                const data = await response.json();
                return data.streams || [];
            } catch (error) {
                console.error('Failed to fetch data:', error);
                return [];
            }
        }

        function playStream(stream, div) {
            console.log("Selected stream:", stream);

            activeHash = stream.infoHash;
            downloadButton.style.display = 'flex';

            document.querySelectorAll('.stream.active')
                .forEach(el => el.classList.remove('active'));

            div.classList.add('active');

            document.getElementById('player').innerHTML = '';

            window.webtor = window.webtor || [];
            const filename = stream.behaviorHints?.filename;

            
            
            const homedir = stream.title.split('\n')[0];

            
            window.webtor.push({
                id: 'player',
                magnet: `magnet:?xt=urn:btih:${stream.infoHash}`,
                lang: 'en',
                width: '100%',
                height: '100%',
            });
        }

        function renderStreams(streams) {
            const list = document.getElementById('streamList');
            list.innerHTML = '';
            document.getElementById('listHeader').textContent = `Streams (${streams.length}/${allStreams.length})`;

            if (!streams.length) {
                list.textContent = 'No matches';
                return;
            }

            for (const stream of streams) {
                const div = document.createElement('div');
                // FIX 1: moved inside the loop, replaces `div.className = 'stream'`
                div.className = 'stream' + (stream.infoHash === activeHash ? ' active' : '');

                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = stream.name;

                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = stream.title;

                div.append(name, title);
                div.addEventListener('click', () => playStream(stream, div));
                list.appendChild(div);
            }
        }

        function filterStreams() {
            const terms = searchInput.value.toLowerCase().split(/\s+/).filter(Boolean);
            const shown = allStreams.filter(s => {
                const text = (s.name + ' ' + s.title).toLowerCase();
                return terms.every(t => text.includes(t));
            });
            renderStreams(shown);
        }

        searchInput.addEventListener('input', filterStreams);        
        submitButton.addEventListener('click', async function () {
            const id = inputField.value.trim();

            if (!/^tt\d+$/.test(id)) {
                alert('Please enter a valid IMDb ID or select a title.');
                return;
            }

            let url;

            if (selectedMediaType === 'tv') {
                const season = seasonSelect.value;
                const episode = episodeSelect.value;

                if (season === '' || episode === '') {
                    alert('Please select a season and episode.');
                    return;
                }

                url = `https://torrentio.strem.fun/stream/series/${id}:${season}:${episode}.json`;
            } else {
                url = `https://torrentio.strem.fun/stream/movie/${id}.json`;
            }

            submitButton.disabled = true;

            try {
                const streams = await fetchStreams(url);

                if (!streams.length) {
                    allStreams = [];
                    document.getElementById('streamList').textContent = 'No streams found';
                    document.getElementById('listHeader').textContent = 'Streams (0)';
                    return;
                }

                allStreams = streams;
                searchInput.value = '';
                searchInput.disabled = false;
                renderStreams(allStreams);
            } finally {
                submitButton.disabled = false;
            }
        });

    </script>
    <script src="https://cdn.jsdelivr.net/npm/@webtor/embed-sdk-js/dist/index.min.js" charset="utf-8" async></script>
</body>
</html>
