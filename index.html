<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Streamer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #111;
            color: #eee;
            font-family: system-ui, sans-serif;
        }

        /* Top bar */
        .topbar {
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            background: #1b1b1b;
            border-bottom: 1px solid #333;
        }
        .topbar input {
            flex: 1;
            max-width: 360px;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #222;
            color: inherit;
        }
        .topbar button {
            padding: 8px 16px;
            border: 0;
            border-radius: 6px;
            background: #e23636;
            color: #fff;
            cursor: pointer;
        }

        /* Main layout: player + sidebar */
        .layout {
            flex: 1;
            display: flex;
            min-height: 0;          /* lets the sidebar scroll instead of growing */
        }
        .main {
            flex: 1;
            padding: 14px;
            min-width: 0;
        }
        .main .webtor {
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 16 / 9;
            margin: 0 auto;
        }

        .sidebar {
            width: 380px;
            overflow-y: auto;
            padding: 10px;
            background: #1b1b1b;
            border-left: 1px solid #333;
        }
        .sidebar h3 { margin: 4px 4px 10px; font-size: 1em; color: #aaa; }

        #streamSearch {
            position: sticky;
            top: 0;
            z-index: 1;
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #222;
            color: inherit;
        }

        .stream {
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            background: #222;
        }
        .stream:hover { background: #2c2c2c; }
        .stream.active { border-color: #e23636; background: #2a1d1d; }
        .stream .name { font-weight: bold; white-space: pre-line; }
        .stream .title {
            white-space: pre-line;
            font-size: 0.82em;
            color: #bbb;
            word-break: break-word;
        }

        /* Stack on small screens */
        @media (max-width: 800px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; height: 40vh; border-left: 0; border-top: 1px solid #333; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <input type="text" id="userInput" placeholder="Type IMDb ID here (e.g. tt1234567)">
        <button id="submitBtn">Load</button>
    </div>

    <div class="layout">
        <div class="main">
            <div id="player" class="webtor"></div>
        </div>

        <aside class="sidebar">
            <h3 id="listHeader">Streams</h3>
            <input type="search" id="streamSearch" placeholder="Filter: 4k, DV, atmos, source…" disabled>
            <div id="streamList"></div>
        </aside>
    </div>

    <script>
        const searchInput = document.getElementById('streamSearch');
        const inputField = document.getElementById('userInput');
        const submitButton = document.getElementById('submitBtn');

        let allStreams = [];
        let activeHash = null;

        async function fetchStreams(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                const data = await response.json();
                return data.streams || [];
            } catch (error) {
                console.error('Failed to fetch data:', error);
                return [];
            }
        }

        function playStream(stream, div) {
            activeHash = stream.infoHash;   // FIX 2: remember what's playing

            document.querySelectorAll('.stream.active').forEach(el => el.classList.remove('active'));
            div.classList.add('active');

            document.getElementById('player').innerHTML = '';
            window.webtor = window.webtor || [];
            window.webtor.push({
                id: 'player',
                magnet: `magnet:?xt=urn:btih:${stream.infoHash}`,
                lang: 'en',
                width: '100%',
                height: '100%',
            });
        }

        function renderStreams(streams) {
            const list = document.getElementById('streamList');
            list.innerHTML = '';
            document.getElementById('listHeader').textContent = `Streams (${streams.length}/${allStreams.length})`;

            if (!streams.length) {
                list.textContent = 'No matches';
                return;
            }

            for (const stream of streams) {
                const div = document.createElement('div');
                // FIX 1: moved inside the loop, replaces `div.className = 'stream'`
                div.className = 'stream' + (stream.infoHash === activeHash ? ' active' : '');

                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = stream.name;

                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = stream.title;

                div.append(name, title);
                div.addEventListener('click', () => playStream(stream, div));
                list.appendChild(div);
            }
        }

        function filterStreams() {
            const terms = searchInput.value.toLowerCase().split(/\s+/).filter(Boolean);
            const shown = allStreams.filter(s => {
                const text = (s.name + ' ' + s.title).toLowerCase();
                return terms.every(t => text.includes(t));
            });
            renderStreams(shown);
        }

        searchInput.addEventListener('input', filterStreams);

        submitButton.addEventListener('click', async function () {
            const id = inputField.value.trim();
            const streams = await fetchStreams(`https://torrentio.strem.fun/stream/movie/${id}.json`);

            if (!streams.length) {
                document.getElementById('streamList').textContent = 'No streams found';
                return;
            }

            // FIX 3: store the full list and enable the search box
            allStreams = streams;
            searchInput.value = '';
            searchInput.disabled = false;
            renderStreams(allStreams);
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@webtor/embed-sdk-js/dist/index.min.js" charset="utf-8" async></script>
</body>
</html>
